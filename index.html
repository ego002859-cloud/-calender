<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DualTrack Dynamic Category Tracker</title>
  <style>
    :root {
      --bg-color: #0c0f17;
      --card-dark: #161b26;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-dark: #0f172a;
      --border-color: rgba(255, 255, 255, 0.1);

      /* 기본 테마: 오렌지 / 골드 */
      --accent-color: #f59e0b;
      --accent-solid: #f59e0b;
      --card-active: linear-gradient(135deg, #f59e0b, #d97706);
      --shadow-accent: 0 6px 16px rgba(245, 158, 11, 0.25);
    }

    /* 라임 그린 테마 */
    body.theme-green {
      --accent-color: #ccff00;
      --accent-solid: #ccff00;
      --card-active: linear-gradient(135deg, #d4ff00, #a3e600);
      --shadow-accent: 0 6px 16px rgba(204, 255, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 16px 85px 16px;
      max-width: 480px;
      margin: 0 auto;
      transition: background 0.3s;
    }

    /* Header Navigation */
    header { margin-bottom: 16px; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: var(--card-dark);
      border: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-main); font-weight: bold; cursor: pointer;
    }

    .month-title {
      font-size: 1.1rem; font-weight: 800; color: var(--text-main);
      display: flex; align-items: center; gap: 6px;
    }

    .month-nav-btn {
      background: none; border: none; color: var(--text-sub);
      font-size: 1.05rem; cursor: pointer; padding: 2px 6px;
    }

    /* Theme Selector Bar */
    .theme-selector-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-dark);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 14px;
      margin-bottom: 14px;
    }

    .theme-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .theme-options {
      display: flex;
      gap: 8px;
    }

    .theme-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }

    .theme-dot.orange { background: #f59e0b; }
    .theme-dot.green { background: #ccff00; }

    .theme-dot.active {
      border-color: #ffffff;
      transform: scale(1.12);
    }

    /* Fixed 7-Day Weekly Grid */
    .weekly-grid-container {
      margin-bottom: 16px;
    }

    .weekly-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      width: 100%;
    }

    .week-pill {
      height: 56px;
      border-radius: 16px;
      background: var(--card-dark);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 2px 0;
    }

    .week-pill .day-num { font-size: 0.95rem; font-weight: 800; color: var(--text-main); line-height: 1.1; }
    .week-pill .day-name { font-size: 0.65rem; font-weight: 600; color: var(--text-sub); line-height: 1; }

    .week-pill.active {
      background: var(--card-active);
      border-color: transparent;
      box-shadow: var(--shadow-accent);
    }

    .week-pill.active .day-num,
    .week-pill.active .day-name { color: var(--text-dark); }

    /* Category Filter Chips Bar */
    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-row::-webkit-scrollbar { display: none; }

    .filter-chip {
      padding: 6px 14px; border-radius: 18px;
      font-size: 0.75rem; font-weight: 700;
      background: var(--card-dark); border: 1px solid var(--border-color);
      color: var(--text-sub); cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
      display: flex; align-items: center; gap: 4px;
    }

    .filter-chip.active {
      background: var(--accent-color);
      color: var(--text-dark);
      border-color: var(--accent-color);
    }

    .filter-chip.add-chip {
      border: 1px dashed var(--accent-color);
      color: var(--accent-color);
      background: rgba(255, 255, 255, 0.02);
    }

    .section-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); margin-bottom: 14px; }

    /* Timeline */
    .timeline { display: flex; flex-direction: column; gap: 12px; }

    /* Full-Width Cards Styling */
    .schedule-card {
      width: 100%;
      border-radius: 20px;
      padding: 16px 18px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      cursor: pointer; transition: all 0.25s ease;
    }

    .schedule-card.is-pending {
      background: var(--card-active);
      border: none;
      color: var(--text-dark);
      box-shadow: var(--shadow-accent);
    }

    .schedule-card.is-completed {
      background: var(--card-dark);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      box-shadow: none;
    }

    .card-content { display: flex; flex-direction: column; gap: 8px; flex: 1; }

    .card-top-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tag {
      font-size: 0.65rem; font-weight: 800;
      padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
      letter-spacing: 0.3px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .time-badge-prominent {
      font-size: 0.82rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 8px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .schedule-card.is-pending .tag {
      background: rgba(15, 23, 42, 0.18);
      color: var(--text-dark);
    }

    .schedule-card.is-pending .time-badge-prominent {
      background: #0f172a;
      color: var(--accent-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .schedule-card.is-completed .tag {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-sub);
      border: 1px solid var(--border-color);
    }

    .schedule-card.is-completed .time-badge-prominent {
      background: rgba(255, 255, 255, 0.06);
      color: var(--accent-color);
      border: 1px solid var(--border-color);
    }

    .plan-text {
      font-size: 0.98rem; font-weight: 800; line-height: 1.35;
    }

    .schedule-card.is-pending .plan-text { color: var(--text-dark); }
    .schedule-card.is-completed .plan-text {
      color: var(--text-sub);
      text-decoration: line-through;
    }

    .check-pill {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; font-weight: 900;
      cursor: pointer; flex-shrink: 0; transition: all 0.2s;
    }

    .schedule-card.is-pending .check-pill {
      border: 2px solid rgba(15, 23, 42, 0.35);
      background: transparent;
      color: transparent;
    }

    .schedule-card.is-completed .check-pill {
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-color);
    }

    .add-schedule-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 16px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      color: var(--text-sub); font-size: 0.88rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease;
      margin-top: 6px;
    }

    .add-schedule-card:active {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .plus-icon { font-size: 1.2rem; font-weight: 300; line-height: 1; }

    /* Bottom Action Toolbar */
    .toolbar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(12, 15, 23, 0.92); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-color); padding: 12px 16px;
      display: flex; gap: 8px; max-width: 480px; margin: 0 auto;
      z-index: 90;
    }

    .btn-tool {
      flex: 1; padding: 10px 6px; border-radius: 12px;
      border: 1px solid var(--border-color); background: var(--card-dark);
      color: var(--text-main); font-size: 0.76rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-tool.clear-btn {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.25);
      background: rgba(239, 68, 68, 0.08);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 100;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: #1a202c; border: 1px solid var(--border-color);
      border-radius: 22px; width: 100%; max-width: 380px; padding: 20px;
    }
    .form-group { margin-bottom: 12px; }
    .form-label { font-size: 0.72rem; font-weight: 700; color: var(--text-sub); display: block; margin-bottom: 4px; }
    .form-input, .form-select {
      width: 100%; background: var(--bg-color); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 10px 12px; border-radius: 10px; font-size: 0.85rem; outline: none;
    }

    .time-picker-row { display: flex; align-items: center; gap: 8px; }
    .time-picker-divider { color: var(--text-sub); font-weight: 800; font-size: 0.85rem; }

    .btn-primary { width: 100%; background: var(--accent-solid); color: var(--text-dark); border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }

    .cat-manage-list {
      display: flex; flex-direction: column; gap: 8px;
      max-height: 160px; overflow-y: auto; margin-bottom: 14px;
    }

    .cat-manage-item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-color); padding: 8px 12px;
      border-radius: 10px; border: 1px solid var(--border-color);
      font-size: 0.82rem; font-weight: 700;
    }

    .cat-del-btn { color: #f87171; background: none; border: none; font-size: 0.78rem; cursor: pointer; font-weight: 700; }
  </style>
</head>
<body class="theme-orange">

  <header>
    <div class="top-bar">
      <div class="icon-btn">❮</div>
      <div class="month-title">
        <button class="month-nav-btn" onclick="changeWeek(-1)">❮</button>
        <span id="monthYearLabel">2026.07</span>
        <button class="month-nav-btn" onclick="changeWeek(1)">❯</button>
      </div>
      <div class="icon-btn">👤</div>
    </div>

    <!-- Theme Switcher -->
    <div class="theme-selector-bar">
      <span class="theme-title">테마 컬러 선택</span>
      <div class="theme-options">
        <div class="theme-dot orange active" title="오렌지/골드" onclick="switchTheme('orange')"></div>
        <div class="theme-dot green" title="라임 그린" onclick="switchTheme('green')"></div>
      </div>
    </div>

    <!-- 주간 고정 캘린더 -->
    <div class="weekly-grid-container">
      <div class="weekly-grid" id="weeklyGrid"></div>
    </div>

    <!-- 동적 카테고리 필터 바 ('전체' 포함) -->
    <div class="filter-row" id="filterRow"></div>
  </header>

  <div class="section-title">일정 (Schedule)</div>

  <div class="timeline" id="timelineContainer"></div>

  <!-- 맨 아래 옅은 '+' 일정 추가 카드 -->
  <div class="add-schedule-card" onclick="openNewScheduleModal()">
    <span class="plus-icon">+</span>
    <span>새 일정 추가하기</span>
  </div>

  <!-- 하단 액션 툴바 -->
  <div class="toolbar">
    <button class="btn-tool clear-btn" onclick="clearDaySchedule()">🗑️ 당일 비우기</button>
    <button class="btn-tool" onclick="exportData()">💾 백업</button>
  </div>

  <!-- Schedule Edit / Add Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h3 style="margin-bottom: 14px; font-size:1.05rem; font-weight:800;" id="modalTitle">일정 관리</h3>
      
      <div class="form-group">
        <label class="form-label">시간 설정 (시작 ~ 종료)</label>
        <div class="time-picker-row">
          <select class="form-select" id="modalStartTime"></select>
          <span class="time-picker-divider">~</span>
          <select class="form-select" id="modalEndTime"></select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">업무 분류 (카테고리)</label>
        <select class="form-select" id="modalCategory"></select>
      </div>
      <div class="form-group">
        <label class="form-label">계획 (Plan)</label>
        <input type="text" class="form-input" id="modalPlan" placeholder="계획 내용 입력">
      </div>
      <div class="form-group">
        <label class="form-label">실행 메모 (선택사항)</label>
        <input type="text" class="form-input" id="modalActual" placeholder="수정 사항 또는 실행 메모">
      </div>
      <div style="display:flex; gap:8px; margin-top:16px;">
        <button class="btn-danger" id="btnDelete" onclick="deleteSchedule()" style="display:none;">삭제</button>
        <button style="flex:1; background:transparent; border:1px solid var(--border-color); color:var(--text-sub); border-radius:10px; font-weight:700;" onclick="closeModal()">취소</button>
        <button class="btn-primary" style="flex:2;" onclick="saveModal()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- Category Add/Manage Modal -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal-box">
      <h3 style="margin-bottom: 14px; font-size:1.05rem; font-weight:800;">카테고리 관리</h3>
      
      <div class="form-group">
        <label class="form-label">새 카테고리 이름</label>
        <input type="text" class="form-input" id="newCatInput" placeholder="예: 외주편집, 개인운동 등">
      </div>
      <button class="btn-primary" style="margin-bottom: 16px;" onclick="addCategory()">+ 카테고리 추가</button>

      <label class="form-label">등록된 카테고리 목록</label>
      <div class="cat-manage-list" id="catManageList"></div>

      <button style="width:100%; background:transparent; border:1px solid var(--border-color); color:var(--text-sub); border-radius:10px; padding:10px; font-weight:700;" onclick="closeCatModal()">닫기</button>
    </div>
  </div>

  <script>
    function generate30MinOptions() {
      const times = [];
      for (let h = 0; h < 24; h++) {
        const hh = String(h).padStart(2, '0');
        times.push(`${hh}:00`);
        times.push(`${hh}:30`);
      }
      return times;
    }

    const TIME_OPTIONS = generate30MinOptions();

    function populateTimeSelects() {
      const startSelect = document.getElementById('modalStartTime');
      const endSelect = document.getElementById('modalEndTime');
      startSelect.innerHTML = '';
      endSelect.innerHTML = '';

      TIME_OPTIONS.forEach(t => {
        const opt1 = document.createElement('option');
        opt1.value = t; opt1.innerText = t;
        startSelect.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = t; opt2.innerText = t;
        endSelect.appendChild(opt2);
      });
    }

    let selectedDate = new Date();
    let dbData = JSON.parse(localStorage.getItem('dualtrack_clean_empty_db')) || {};
    let userCategories = JSON.parse(localStorage.getItem('dualtrack_custom_cats')) || ['문화부', 'acut'];
    let currentFilter = '전체'; // 기본적으로 '전체' 보기 선택

    let editingSlotKey = null;
    let isCreatingNew = false;
    let currentTheme = localStorage.getItem('dualtrack_theme') || 'orange';

    function getFormattedDate(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function getMonday(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function init() {
      applyTheme(currentTheme);
      populateTimeSelects();
      renderCategoryFilterBar();
      renderWeeklyGrid();
      const dateStr = getFormattedDate(selectedDate);
      if (!dbData[dateStr]) {
        dbData[dateStr] = {};
      }
      renderTimeline();
    }

    function saveCategories() {
      localStorage.setItem('dualtrack_custom_cats', JSON.stringify(userCategories));
    }

    /* 동적 카테고리 필터 바 ('전체' 칩 포함) */
    function renderCategoryFilterBar() {
      const filterContainer = document.getElementById('filterRow');
      filterContainer.innerHTML = '';

      // 1. 맨 앞에 '전체' 필터 칩 추가
      const allBtn = document.createElement('button');
      allBtn.className = `filter-chip ${currentFilter === '전체' ? 'active' : ''}`;
      allBtn.innerText = '전체';
      allBtn.onclick = () => {
        currentFilter = '전체';
        renderCategoryFilterBar();
        renderTimeline();
      };
      filterContainer.appendChild(allBtn);

      // 2. 사용자가 등록한 카테고리 칩들
      userCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = `filter-chip ${currentFilter === cat ? 'active' : ''}`;
        btn.innerText = cat;
        btn.onclick = () => {
          currentFilter = cat;
          renderCategoryFilterBar();
          renderTimeline();
        };
        filterContainer.appendChild(btn);
      });

      // 3. + 추가 버튼
      const addBtn = document.createElement('button');
      addBtn.className = 'filter-chip add-chip';
      addBtn.innerHTML = '<span>+ 추가</span>';
      addBtn.onclick = openCatModal;
      filterContainer.appendChild(addBtn);

      // 일정 추가 모달 드롭다운 항목
      const selectModal = document.getElementById('modalCategory');
      selectModal.innerHTML = '';
      userCategories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = cat;
        selectModal.appendChild(opt);
      });
    }

    function openCatModal() {
      renderCatManageList();
      document.getElementById('categoryModal').classList.add('active');
    }

    function closeCatModal() {
      document.getElementById('categoryModal').classList.remove('active');
    }

    function renderCatManageList() {
      const container = document.getElementById('catManageList');
      container.innerHTML = '';

      userCategories.forEach((cat, index) => {
        const item = document.createElement('div');
        item.className = 'cat-manage-item';
        item.innerHTML = `
          <span>🏷️ ${cat}</span>
          ${userCategories.length > 1 ? `<button class="cat-del-btn" onclick="removeCategory(${index})">삭제</button>` : '<span style="font-size:0.7rem; color:var(--text-sub);">최소 1개 유지</span>'}
        `;
        container.appendChild(item);
      });
    }

    function addCategory() {
      const input = document.getElementById('newCatInput');
      const val = input.value.trim();
      if (!val) {
        alert('카테고리 이름을 입력해주세요.');
        return;
      }
      if (val === '전체') {
        alert("'전체'는 카테고리 이름으로 사용할 수 없습니다.");
        return;
      }
      if (userCategories.includes(val)) {
        alert('이미 존재하는 카테고리입니다.');
        return;
      }

      userCategories.push(val);
      saveCategories();
      input.value = '';
      currentFilter = val;
      renderCatManageList();
      renderCategoryFilterBar();
      renderTimeline();
    }

    function removeCategory(index) {
      if (confirm(`'${userCategories[index]}' 카테고리를 삭제하시겠습니까?`)) {
        userCategories.splice(index, 1);
        saveCategories();
        renderCatManageList();
        renderCategoryFilterBar();
        renderTimeline();
      }
    }

    function switchTheme(themeName) {
      currentTheme = themeName;
      localStorage.setItem('dualtrack_theme', themeName);
      applyTheme(themeName);
      renderTimeline();
    }

    function applyTheme(themeName) {
      document.body.className = themeName === 'green' ? 'theme-green' : 'theme-orange';
      document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
      const activeDot = document.querySelector(`.theme-dot.${themeName}`);
      if (activeDot) activeDot.classList.add('active');
    }

    function save() {
      localStorage.setItem('dualtrack_clean_empty_db', JSON.stringify(dbData));
    }

    function renderWeeklyGrid() {
      const container = document.getElementById('weeklyGrid');
      container.innerHTML = '';

      const monday = getMonday(selectedDate);
      document.getElementById('monthYearLabel').innerText = `${selectedDate.getFullYear()}.${String(selectedDate.getMonth() + 1).padStart(2, '0')}`;

      const daysOfWeek = ['월', '화', '수', '목', '금', '토', '일'];

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);

        const isCurrent = getFormattedDate(d) === getFormattedDate(selectedDate);

        const pill = document.createElement('div');
        pill.className = `week-pill ${isCurrent ? 'active' : ''}`;
        pill.onclick = () => {
          selectedDate = d;
          init();
        };

        pill.innerHTML = `
          <span class="day-num">${d.getDate()}</span>
          <span class="day-name">${daysOfWeek[i]}</span>
        `;
        container.appendChild(pill);
      }
    }

    function renderTimeline() {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';
      const dateStr = getFormattedDate(selectedDate);
      const dayData = dbData[dateStr] || {};

      const sortedTimes = Object.keys(dayData).sort();

      // '전체'일 때는 모든 카테고리 표시, 특정 카테고리일 때는 해당 카테고리만 필터링
      const filteredKeys = sortedTimes.filter(key => {
        if (currentFilter === '전체') return true;
        return dayData[key].category === currentFilter;
      });

      if (filteredKeys.length === 0) {
        const msg = currentFilter === '전체' 
          ? '등록된 일정이 없습니다.' 
          : `'${currentFilter}' 카테고리에 등록된 일정이 없습니다.`;

        container.innerHTML = `
          <div style="text-align:center; padding: 40px 16px; color:var(--text-sub); font-size:0.85rem; background:var(--card-dark); border-radius:20px; border:1px dashed var(--border-color);">
            ${msg}<br>하단의 <b style="color:var(--accent-color);">'+ 새 일정 추가하기'</b> 버튼을 눌러 추가해보세요!
          </div>
        `;
        return;
      }

      filteredKeys.forEach(key => {
        const slot = dayData[key];

        const stateClass = slot.done ? 'is-completed' : 'is-pending';
        const displayTime = slot.startTime && slot.endTime ? `${slot.startTime} - ${slot.endTime}` : key;

        const card = document.createElement('div');
        card.className = `schedule-card ${stateClass}`;
        card.onclick = () => openEditModal(key);

        card.innerHTML = `
          <div class="card-content">
            <div class="card-top-meta">
              <div class="meta-left">
                <span class="tag">${slot.category}</span>
              </div>
              <span class="time-badge-prominent">⏱ ${displayTime}</span>
            </div>
            <div class="plan-text">${slot.plan || '계획 없음'}</div>
            ${slot.actual ? `<div style="font-size:0.78rem; opacity:0.85;">📝 ${slot.actual}</div>` : ''}
          </div>
          <button class="check-pill" onclick="event.stopPropagation(); toggleDone('${key}')">✓</button>
        `;
        container.appendChild(card);
      });
    }

    function toggleDone(key) {
      const dateStr = getFormattedDate(selectedDate);
      dbData[dateStr][key].done = !dbData[dateStr][key].done;
      save();
      renderTimeline();
    }

    function openNewScheduleModal() {
      isCreatingNew = true;
      editingSlotKey = null;
      document.getElementById('modalTitle').innerText = '새 일정 추가';
      document.getElementById('modalStartTime').value = '09:00';
      document.getElementById('modalEndTime').value = '10:00';
      // '전체' 필터 상태이면 첫 번째 카테고리로 기본 선택
      const defaultCat = currentFilter === '전체' ? (userCategories[0] || '문화부') : currentFilter;
      document.getElementById('modalCategory').value = defaultCat;
      document.getElementById('modalPlan').value = '';
      document.getElementById('modalActual').value = '';
      document.getElementById('btnDelete').style.display = 'none';
      document.getElementById('editModal').classList.add('active');
    }

    function openEditModal(key) {
      isCreatingNew = false;
      editingSlotKey = key;
      const dateStr = getFormattedDate(selectedDate);
      const slot = dbData[dateStr][key];

      document.getElementById('modalTitle').innerText = `일정 수정`;
      document.getElementById('modalStartTime').value = slot.startTime || '09:00';
      document.getElementById('modalEndTime').value = slot.endTime || '10:00';
      document.getElementById('modalCategory').value = slot.category;
      document.getElementById('modalPlan').value = slot.plan;
      document.getElementById('modalActual').value = slot.actual || '';
      document.getElementById('btnDelete').style.display = 'block';
      document.getElementById('editModal').classList.add('active');
    }

    function closeModal() { document.getElementById('editModal').classList.remove('active'); }

    function saveModal() {
      const dateStr = getFormattedDate(selectedDate);
      const startTime = document.getElementById('modalStartTime').value;
      const endTime = document.getElementById('modalEndTime').value;
      const catVal = document.getElementById('modalCategory').value;
      const planVal = document.getElementById('modalPlan').value.trim();
      const actualVal = document.getElementById('modalActual').value.trim();

      if (startTime >= endTime) {
        alert('종료 시간은 시작 시간보다 뒤여야 합니다.');
        return;
      }

      if (!planVal) {
        alert('계획 내용을 입력해주세요.');
        return;
      }

      const key = `${startTime} - ${endTime}`;

      if (isCreatingNew) {
        dbData[dateStr][key] = {
          startTime: startTime,
          endTime: endTime,
          category: catVal,
          plan: planVal,
          actual: actualVal,
          done: false
        };
      } else {
        const oldData = dbData[dateStr][editingSlotKey];
        if (editingSlotKey !== key) {
          delete dbData[dateStr][editingSlotKey];
        }
        dbData[dateStr][key] = {
          startTime: startTime,
          endTime: endTime,
          category: catVal,
          plan: planVal,
          actual: actualVal,
          done: oldData ? oldData.done : false
        };
      }

      save();
      closeModal();
      renderTimeline();
    }

    function deleteSchedule() {
      if (!editingSlotKey) return;
      if (confirm('이 일정을 삭제하시겠습니까?')) {
        const dateStr = getFormattedDate(selectedDate);
        delete dbData[dateStr][editingSlotKey];
        save();
        closeModal();
        renderTimeline();
      }
    }

    function clearDaySchedule() {
      const dateStr = getFormattedDate(selectedDate);
      const count = Object.keys(dbData[dateStr] || {}).length;
      if (count === 0) {
        alert('삭제할 일정이 없습니다.');
        return;
      }

      if (confirm(`선택한 날짜(${dateStr})의 모든 일정(${count}개)을 삭제하시겠습니까?`)) {
        dbData[dateStr] = {};
        save();
        renderTimeline();
      }
    }

    function changeWeek(offset) {
      selectedDate.setDate(selectedDate.getDate() + (offset * 7));
      init();
    }

    function exportData() {
      const dateStr = getFormattedDate(selectedDate);
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dbData, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `my_schedule_${dateStr}.json`;
      a.click();
    }

    init();
  </script>
</body>
</html>
